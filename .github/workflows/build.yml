name: Build ejecutables
on:
  workflow_dispatch:
  push:
    branches: [ccr-ad95f5fc-uo3t5q]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name escritorio-remoto --add-data "static${{ matrix.os == 'windows-latest' && ';' || ':' }}static" --add-data "retroceder${{ matrix.os == 'windows-latest' && ';' || ':' }}retroceder" server.py
      - uses: actions/upload-artifact@v4
        with:
          name: escritorio-remoto-${{ matrix.os }}
          path: dist/*
