name: Build Retroceder PC
on:
  workflow_dispatch:
  push:
    branches: [ccr-b9155ef9-d4adj9]
    paths: [retroceder_pc/**, .github/workflows/build-retroceder.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r retroceder_pc/requirements.txt pyinstaller
      - run: pyinstaller --onefile --uac-admin --name RetrocederPC retroceder_pc/retroceder_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: RetrocederPC-windows
          path: dist/RetrocederPC.exe
      - name: Publicar descarga directa (release "descarga")
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view descarga >/dev/null 2>&1 || gh release create descarga --title "Retroceder PC (última versión)" --notes "Descarga RetrocederPC.exe y ábrelo en la PC." --target "$GITHUB_SHA"
          gh release upload descarga dist/RetrocederPC.exe --clobber
