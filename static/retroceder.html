<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retroceder PC</title>
<link rel="manifest" href="/retroceder/manifest.json" crossorigin="use-credentials">
<meta name="theme-color" content="#0f172a">
<style>
body{margin:0;font:16px system-ui;background:#0f172a;color:#e2e8f0;padding:16px;max-width:480px;margin:auto}
h1{font-size:22px}button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:12px;font-size:17px;background:#334155;color:#fff}
button.big{background:#dc2626;font-weight:700}button.ok{background:#0284c7}
.card{background:#1e293b;border-radius:12px;padding:12px;margin:12px 0}small{color:#94a3b8}
input{padding:12px;border-radius:8px;border:0;width:90px;font-size:16px}
#msg{white-space:pre-wrap;color:#fbbf24}
</style></head><body>
<h1>⏪ Retroceder PC</h1>
<div class="card" id="estado">Cargando…</div>
<button class="big" id="ahora">Restaurar a hace <span class="h">10</span> h (ahora)</button>
<div class="card">
  <b>Temporizador</b><br><small>Restaura automáticamente después de:</small><br>
  <input id="min" type="number" value="60" min="1"> minutos
  <button class="ok" id="prog">Iniciar temporizador</button>
  <button id="canc" hidden>Cancelar temporizador</button>
  <div id="cuenta"></div>
</div>
<button id="crear">Crear punto de restauración ahora</button>
<button id="inst">Instalar (un punto cada hora)</button>
<div id="msg"></div>
<small>Instalar en Android: menú ⋮ de Chrome → «Instalar app» / «Añadir a pantalla de inicio».</small>
<script>
const H={"X-Requested-With":"retroceder","Content-Type":"application/json"};
const $=i=>document.getElementById(i);let tmp=null;
async function api(u,m="GET",b){const r=await fetch(u,{method:m,headers:H,body:b?JSON.stringify(b):undefined});
  let j;try{j=await r.json()}catch{j={error:await r.text()}}return j}
async function cargar(){
  const d=await api("/api/retroceder");
  if(d.error){$("estado").textContent=d.error;return}
  document.querySelectorAll(".h").forEach(e=>e.textContent=d.horas);
  const t=d.puntos.find(p=>p.numero===d.objetivo);
  $("estado").innerHTML=t?`Se restaurará al punto del <b>${t.fecha.replace("T"," ")}</b><br><small>${d.puntos.length} puntos disponibles</small>`
   :`⚠ Aún no hay un punto de hace ${d.horas} h.<br><small>${d.puntos.length} puntos. Pulsa «Instalar» y espera.</small>`;
  tmp=d.temporizador;pintar()}
function pintar(){
  $("canc").hidden=!tmp;
  if(!tmp){$("cuenta").textContent="";return}
  const s=Math.max(0,tmp-Math.floor(Date.now()/1000));
  $("cuenta").textContent=`Restaura en ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
setInterval(pintar,1000);
$("ahora").onclick=async()=>{if(!confirm("¿Restaurar la PC? Se reiniciará."))return;
  $("msg").textContent="Restaurando…";const r=await api("/api/retroceder/ejecutar","POST");$("msg").textContent=r.msg||r.error||""};
$("prog").onclick=async()=>{const r=await api("/api/retroceder/temporizador","POST",{minutos:+$("min").value});tmp=r.temporizador;pintar()};
$("canc").onclick=async()=>{await api("/api/retroceder/temporizador","DELETE");tmp=null;pintar()};
$("crear").onclick=async()=>{const r=await api("/api/retroceder/crear","POST");$("msg").textContent=r.msg||r.error||"";cargar()};
$("inst").onclick=async()=>{const r=await api("/api/retroceder/instalar","POST");$("msg").textContent=r.msg||r.error||"";cargar()};
if("serviceWorker"in navigator)navigator.serviceWorker.register("/retroceder/sw.js",{scope:"/"}).catch(()=>{});
cargar();
</script></body></html>
